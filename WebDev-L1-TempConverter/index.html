<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    <div class="converter-card">
        <div class="header">
            <span class="badge">Live Tool</span>
            <h2>Temperature Converter</h2>
            <p>Convert units instantly with real-time validation</p>
        </div>

        <div class="input-container">
            <div class="input-field">
                <label for="tempInput">Degrees</label>
                <input type="number" id="tempInput" placeholder="e.g. 35" step="any">
            </div>
            <div class="input-field">
                <label for="unitInput">Unit</label>
                <select id="unitInput">
                    <option value="C">Celsius (°C)</option>
                    <option value="F">Fahrenheit (°F)</option>
                    <option value="K">Kelvin (K)</option>
                </select>
            </div>
        </div>

        <button id="convertBtn" class="convert-btn">Convert Temperature</button>
        
        <div id="errorMsg" class="error-badge"></div>

        <div class="results-grid" id="resultsGrid">
            <div class="result-tile">
                <span class="unit-label">Celsius</span>
                <span class="unit-val" id="resC">-- °C</span>
            </div>
            <div class="result-tile">
                <span class="unit-label">Fahrenheit</span>
                <span class="unit-val" id="resF">-- °F</span>
            </div>
            <div class="result-tile">
                <span class="unit-label">Kelvin</span>
                <span class="unit-val" id="resK">-- K</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
